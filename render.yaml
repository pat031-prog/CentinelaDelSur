services:
  # Backend API (FastAPI + Python)
  - type: web
    name: atalaya-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atalaya-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: atalaya-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: DEBUG
        value: "false"

  # Frontend (React + Nginx)
  - type: web
    name: atalaya-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: atalaya-backend
          envVarKey: RENDER_EXTERNAL_URL

  # Redis / Key Value Store
  - type: keyvalue
    name: atalaya-redis
    plan: free
    ipAllowList: []

databases:
  - name: atalaya-db
    plan: free
    databaseName: atalaya_db
