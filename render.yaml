services:
  # Backend API (FastAPI + Python)
  - type: web
    name: atalaya-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atalaya-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: atalaya-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPINFRA_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: "gemini"
      - key: NEWS_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: DEBUG
        value: "false"

  # Redis / Key Value Store
  - type: keyvalue
    name: atalaya-redis
    plan: free
    ipAllowList: []

databases:
  - name: atalaya-db
    plan: free
    databaseName: atalaya_db
